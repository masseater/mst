packages:
  - apps/*
  - packages/*
  - tools/*

catalogMode: prefer

catalog:
  "@opentelemetry/api": ^1.9.1
  "@opentelemetry/core": ^2.10.0
  "@opentelemetry/exporter-metrics-otlp-http": ^0.221.0
  "@opentelemetry/resources": ^2.10.0
  "@opentelemetry/sdk-metrics": ^2.10.0
  "@oxlint/plugins": 1.73.0
  "@types/node": ^26
  es-toolkit: ^1.50.0
  jsonc-parser: ^3.3.1
  knip: ^6.32.0
  oxc-parser: ^0.143.0
  oxfmt: 0.61.0
  oxlint: 1.76.0
  typescript: ^7.0.2
  vite: npm:@voidzero-dev/vite-plus-core@0.2.8
  vite-plus: 0.2.8
overrides:
  vite: "catalog:"
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"
