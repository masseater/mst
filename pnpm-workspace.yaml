packages:
  - apps/*
  - packages/*
  - tools/*

catalogMode: prefer

catalog:
  "@oxlint/plugins": 1.73.0
  "@types/node": ^26
  jsonc-parser: ^3.3.1
  knip: ^6.32.0
  oxlint: 1.76.0
  typescript: ^7.0.2
  vite: npm:@voidzero-dev/vite-plus-core@0.2.8
  vite-plus: 0.2.8
overrides:
  vite: "catalog:"
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"
