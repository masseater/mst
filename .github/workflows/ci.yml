name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  ready:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: voidzero-dev/setup-vp@313600b80b104eadebb9111787d37a2e83e014ca # v1.17.0
        with:
          node-version-file: package.json
          cache: true
          run-install: |
            - args: ['--frozen-lockfile']

      - run: vp run guard

      - name: Observe stop-ai-slop findings
        if: github.event_name == 'pull_request'
        continue-on-error: true
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          sha_pattern='^[0-9a-f]{40}([0-9a-f]{24})?$'
          [[ "$BASE_SHA" =~ $sha_pattern ]]
          [[ "$HEAD_SHA" =~ $sha_pattern ]]
          merge_base="$(
            gh api \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "repos/${GH_REPO}/compare/${BASE_SHA}...${HEAD_SHA}" \
              --jq '.merge_base_commit.sha // empty'
          )"
          [[ "$merge_base" =~ $sha_pattern ]]
          gh auth setup-git --hostname github.com
          git -c protocol.version=2 fetch \
            --no-tags \
            --no-recurse-submodules \
            --depth=1 \
            origin \
            "+${merge_base}:refs/mst/pr-base" \
            "+${HEAD_SHA}:refs/mst/pr-head"
          [[ "$(git rev-parse --verify 'refs/mst/pr-base^{commit}')" == "$merge_base" ]]
          [[ "$(git rev-parse --verify 'refs/mst/pr-head^{commit}')" == "$HEAD_SHA" ]]
          vp exec stop-ai-slop check --base "$merge_base" --head "$HEAD_SHA" --repository-root .
