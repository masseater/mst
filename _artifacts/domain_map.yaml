library:
  name: "mst"
  version: "0.0.0"
  repository: "https://github.com/masseater/mst"
  description: "Reusable units of repository operation: repository gates, agent command controls, pull-request automation, lint-rule authoring, and verified agent-facing documents."
  primary_framework: "framework-agnostic"

domains:
  - name: "enforcing writing standards"
    slug: "enforcing-writing-standards"
    description: "Wiring machine-enforced answers to review questions into a repository, and responding to their reports."
  - name: "gating the repository"
    slug: "gating-the-repository"
    description: "Running the repository-wide checks that lint rules cannot express, and keeping every gate a single failing entry."
  - name: "authoring lint rules"
    slug: "authoring-lint-rules"
    description: "Writing custom oxlint rules whose enforcement keeps working after they are written."
  - name: "keeping documents true"
    slug: "keeping-documents-true"
    description: "Writing AI-facing documents that match the repository and keep a machine-followable shape."
  - name: "surfacing verified specifications"
    slug: "surfacing-verified-specifications"
    description: "Declaring behavior claims as specification tests and generating the human-readable list from them."
  - name: "controlling agent command resources"
    slug: "controlling-agent-command-resources"
    description: "Keeping concurrent heavy commands within host capacity, preserving complete command output outside the caller's context window, and rejecting lossy output slicing."
  - name: "operating pull-request review loops"
    slug: "operating-pull-request-review-loops"
    description: "Running the relay, reviewer, and author runtimes so each pull request receives one response against its current input."
  - name: "rejecting removal-only verification"
    slug: "rejecting-removal-only-verification"
    description: "Comparing a change to reject absence assertions added by the same change that removed their subject."

skills:
  - name: "adopt the dont-review-it preset"
    slug: "dont-review-it-core"
    domain: "enforcing-writing-standards"
    description: "Call the formatting and linting preset functions, extend the shared tsconfig presets, and verify custom-rule wiring with a violating file."
    type: "core"
    packages:
      - "@mst/dont-review-it"
    covers:
      - "dontReviewItPreset.fmt()"
      - "dontReviewItPreset.lint()"
      - "ignorePatterns layered through preset options"
      - "@mst/dont-review-it/plugin"
      - "@mst/dont-review-it/tsconfig/library.json"
      - "@mst/dont-review-it/tsconfig/app.json"
      - "vite.config.ts lint/fmt blocks"
    tasks:
      - "adopt the preset in a repository"
      - "verify a custom rule is actually wired"
      - "create a tsconfig that the preset accepts"
    failure_modes:
      - mistake: "ignorePatterns placed in an extended preset"
        mechanism: "oxlint's Oxlintrc::merge keeps only the extending side's ignore_patterns, so patterns shipped through extends silently vanish."
        wrong_pattern: |
          export const preset = defineConfig({
            ignorePatterns: [".agents/"],
          });
        correct_pattern: |
          import { dontReviewItPreset } from "@mst/dont-review-it";
          export default defineConfig({
            lint: dontReviewItPreset.lint({ ignorePatterns: [".agents/"] }),
          });
        source: "masseater/mst:.claude/rules/ai-generated/gotchas.md"
        priority: "HIGH"
        status: "active"
        version_context: "oxc behavior as of oxlint shipped with vite-plus 0.2.x"
      - mistake: "lint.plugins written as an addition"
        mechanism: "plugins replaces the base set, so naming one plugin disables the default unicorn/typescript/oxc rules while lint stays green."
        wrong_pattern: |
          lint: { plugins: ["vitest"] }
        correct_pattern: |
          lint: { plugins: ["unicorn", "typescript", "oxc", "vitest"] }
        source: "masseater/mst:.claude/rules/ai-generated/gotchas.md"
        priority: "HIGH"
        status: "active"
        skills: ["dont-review-it-core", "lint-rule-authoring-core"]
      - mistake: "print-config diff read as proof of js plugin wiring"
        mechanism: "vp lint --print-config resolves built-in rules only, so a js plugin rule appears in no diff and the check passes vacuously."
        wrong_pattern: |
          vp lint --print-config > after.json
          diff before.json after.json
        correct_pattern: |
          echo "export default {}" > packages/x/src/probe.ts
          vp lint packages/x/src/probe.ts
          rm packages/x/src/probe.ts
        source: "masseater/mst:.claude/rules/ai-generated/gotchas.md"
        priority: "HIGH"
        status: "active"
        skills: ["dont-review-it-core", "lint-rule-authoring-core"]
      - mistake: "standalone tsconfig written from scratch"
        mechanism: "a tsconfig without extends drifts from the shared compiler options, and no-standalone-tsconfig reports it."
        wrong_pattern: |
          { "compilerOptions": { "strict": true } }
        correct_pattern: |
          {
            "extends": "@mst/dont-review-it/tsconfig/library.json",
            "include": ["src"]
          }
        source: "masseater/mst:packages/dont-review-it/docs/lint/no-standalone-tsconfig--extend-shared-preset.md"
        priority: "MEDIUM"
        status: "active"
      - mistake: "GitHub alert written with its body on the next line"
        mechanism: "With proseWrap set to never, a marker and adjacent body in one paragraph are joined, which GitHub renders as a plain blockquote instead of an alert."
        wrong_pattern: |
          > [!IMPORTANT] Install through the official installer.
        correct_pattern: |
          > [!IMPORTANT]
          >
          > Install through the official installer.
        source: "masseater/mst:docs/engineering-decision-logs/0046-let-the-formatter-own-where-markdown-lines-break.md"
        priority: "HIGH"
        status: "active"
    compositions:
      - library: "vite-plus"
        skill: "none — the preset assumes the Vite+ toolchain and its vite.config.ts consolidation"

  - name: "run the repository checks"
    slug: "dont-review-it-repository-checks"
    domain: "gating-the-repository"
    description: "Run dont-review-it check as the single entry for repository-wide checks that lint cannot express, including generated entry composition, dependency declarations, workflow definitions, preset adoption, and shipped agent skills."
    type: "core"
    packages:
      - "@mst/dont-review-it"
    covers:
      - "dont-review-it check"
      - "--write"
      - "--repository-root"
      - "entry-composition"
      - "canonical-values"
      - "equivalent-concepts"
      - "duplicated-bodies"
      - "workflow definition checks"
      - "action-updates"
      - "lint-rule-index"
      - "dependency-declarations"
      - "test-execution"
      - "required-file-form"
      - "preset-adoption"
      - "shipped intent skills check"
      - "guard wiring"
    tasks:
      - "wire the check into a repository gate"
      - "fix a reported workflow definition"
      - "make a published package ship its agent skills"
      - "regenerate manifest entry composition and shipped skill versions"
    failure_modes:
      - mistake: "check failure masked to keep a pipeline green"
        mechanism: "an appended || true turns a failing gate into a passing one, and the masked-failure check names exactly this rewrite."
        wrong_pattern: |
          run: pnpm exec dont-review-it check || true
        correct_pattern: |
          run: pnpm run guard
        source: "masseater/mst:packages/dont-review-it/src/workflows/checks/masked-failure.ts"
        priority: "CRITICAL"
        status: "active"
      - mistake: "gate workflow narrowed by its own trigger"
        mechanism: "a required job that filters its trigger by paths or branches never runs on the excluded changes, so the requirement is satisfied by absence."
        wrong_pattern: |
          on:
            push:
              paths: ["src/**"]
        correct_pattern: |
          on:
            push:
        source: "masseater/mst:packages/dont-review-it/src/workflows/checks/gating-trigger-filter.ts"
        priority: "HIGH"
        status: "active"
      - mistake: "run block holding a command sequence"
        mechanism: "logic placed in the workflow file cannot be executed locally, so the single-command-run check requires one command call that a script owns."
        wrong_pattern: |
          run: |
            pnpm install
            pnpm test
        correct_pattern: |
          run: pnpm run guard
        source: "masseater/mst:packages/dont-review-it/src/workflows/checks/single-command-run.ts"
        priority: "MEDIUM"
        status: "active"
      - mistake: "job running on undeclared default permissions"
        mechanism: "a job without a permissions block inherits the runner default, so the granted scopes are invisible in review."
        wrong_pattern: |
          jobs:
            guard:
              runs-on: ubuntu-latest
        correct_pattern: |
          jobs:
            guard:
              runs-on: ubuntu-latest
              permissions: {}
        source: "masseater/mst:packages/dont-review-it/src/workflows/checks/declared-permissions.ts"
        priority: "HIGH"
        status: "active"
      - mistake: "published package shipped without its agent skills"
        mechanism: "a package without skills/**/SKILL.md, without skills in files, or without the tanstack-intent keyword publishes fine, but agents that install it discover nothing."
        wrong_pattern: |
          { "name": "@scope/pkg", "files": ["dist"] }
        correct_pattern: |
          {
            "name": "@scope/pkg",
            "files": ["dist", "skills"],
            "keywords": ["tanstack-intent"]
          }
        source: "masseater/mst:packages/dont-review-it/src/intent-skills/shipped-skills.ts"
        priority: "HIGH"
        status: "active"
      - mistake: "internal package left carrying skill wiring"
        mechanism: "a private package with a skills directory, a skills files entry, or the discovery keyword advertises a distribution surface that never ships."
        wrong_pattern: |
          { "name": "@scope/internal", "private": true, "keywords": ["tanstack-intent"] }
        correct_pattern: |
          { "name": "@scope/internal", "private": true }
        source: "masseater/mst:packages/dont-review-it/src/intent-skills/shipped-skills.ts"
        priority: "MEDIUM"
        status: "active"

  - name: "author a lint rule"
    slug: "lint-rule-authoring-core"
    domain: "authoring-lint-rules"
    description: "Write a custom oxlint rule through the factory, with its test beside it and its prose in a docs file, so the enforcement keeps working after it is written."
    type: "core"
    packages:
      - "@mst/lint-rule-authoring"
    covers:
      - "lint-rule-authoring check"
      - "--write"
      - "createWorkspaceLintRule"
      - "testLintRule"
      - "LINT_SEVERITY"
      - "@mst/lint-rule-authoring/plugin"
      - "report message discipline"
      - "docs/lint/index.md reconciliation"
    tasks:
      - "add a new custom rule"
      - "write the rule's report message"
      - "test the rule"
      - "regenerate the lint-rule indexes"
    failure_modes:
      - mistake: "ParenthesizedExpression branch written in a rule"
        mechanism: "oxlint strips parentheses before handing the AST to js plugins, so the branch is unreachable and coverage never enters it."
        wrong_pattern: |
          if (node.type === "ParenthesizedExpression") {
            return unwrap(node.expression);
          }
        correct_pattern: |
          if (node.type === "ObjectExpression") {
            return node;
          }
        source: "masseater/mst:.claude/rules/ai-generated/gotchas.md"
        priority: "HIGH"
        status: "active"
      - mistake: "report message carrying a reason or a branch"
        mechanism: "reasons push the fix instruction out of the first line and case analysis returns the decision to the reader; the docs file owns both."
        wrong_pattern: |
          "Avoid default exports because they hurt refactoring; use named exports, or keep the default if a framework requires it."
        correct_pattern: |
          "A default export is forbidden. Export the declaration by name."
        source: "masseater/mst:packages/lint-rule-authoring/AGENTS.md"
        priority: "HIGH"
        status: "active"
      - mistake: "new rule confirmed by print-config diff"
        mechanism: "vp lint --print-config never lists js plugin rules, so an empty diff is read as wired when nothing was checked."
        wrong_pattern: |
          vp lint --print-config | grep my-rule
        correct_pattern: |
          echo "const violating = 1" > src/probe.ts
          vp lint src/probe.ts
          rm src/probe.ts
        source: "masseater/mst:.claude/rules/ai-generated/gotchas.md"
        priority: "HIGH"
        status: "active"
        skills: ["lint-rule-authoring-core", "dont-review-it-core"]
      - mistake: "rule added at warn severity"
        mechanism: "warn is the severity a human assigns after judgment; a rule introduced at warn is ignorable from day one and enforces nothing."
        wrong_pattern: |
          rules: { "my-plugin/my-rule": "warn" }
        correct_pattern: |
          rules: { "my-plugin/my-rule": LINT_SEVERITY.ERROR }
        source: "masseater/mst:CLAUDE.md"
        priority: "MEDIUM"
        status: "active"
      - mistake: "rule test isolated in a test directory"
        mechanism: "a test placed under tests/ detaches from its rule and the placement rules report it; the pair belongs side by side with named valid and invalid snippets."
        wrong_pattern: |
          tests/my-rule.spec.ts
        correct_pattern: |
          src/lint/oxlint/rules/my-rule.ts
          src/lint/oxlint/rules/my-rule.test.ts
        source: "masseater/mst:packages/lint-rule-authoring/AGENTS.md"
        priority: "MEDIUM"
        status: "active"

  - name: "write and check agent-facing documents"
    slug: "agentic-documents-core"
    domain: "keeping-documents-true"
    description: "Write normative documents in the condition-action notation and run agentic-documents check to keep them true to the repository."
    type: "core"
    packages:
      - "@mst/agentic-documents"
    covers:
      - "agentic-documents check"
      - "--write"
      - "normative notation (IF/THEN, decision keywords)"
      - "generated regions"
      - "frontmatter description"
    tasks:
      - "write a normative rule an agent can follow"
      - "fix a reported document"
      - "refresh generated regions"
    failure_modes:
      - mistake: "norms written as table rows"
        mechanism: "a rule inside a table cell has no condition-action shape, so readers guess which norm applies; the no-table check reports it."
        wrong_pattern: |
          | Rule | Meaning |
          | ---- | ------- |
          | no-x | avoid x |
        correct_pattern: |
          - IF: x is about to be written; THEN PROHIBIT: write x
        source: "masseater/mst:packages/agentic-documents/src/checks/no-table.ts"
        priority: "HIGH"
        status: "active"
      - mistake: "two decision keywords on one line"
        mechanism: "a line holding MUST and PROHIBIT together leaves the binding keyword ambiguous, and the single-decision-keyword check reports it."
        wrong_pattern: |
          - IF: adding a rule; THEN MUST: add it as error and PROHIBIT: demote it
        correct_pattern: |
          - IF: adding a rule; THEN
            - MUST: add it as error
            - PROHIBIT: demote it
        source: "masseater/mst:packages/agentic-documents/src/checks/single-decision-keyword.ts"
        priority: "MEDIUM"
        status: "active"
      - mistake: "good and bad examples placed as a pair"
        mechanism: "a contrastive pair invites imitating the labels instead of the norm; the contrastive-code-pair check reports the pair in one section."
        wrong_pattern: |
          悪い例: `const x = 1`
          良い例: `const one = 1`
        correct_pattern: |
          `const one = 1`
        source: "masseater/mst:packages/agentic-documents/src/checks/contrastive-code-pair.ts"
        priority: "MEDIUM"
        status: "active"
      - mistake: "generated region edited by hand"
        mechanism: "hand edits inside a generated region are reported as stale on the next check; the generator owns the region."
        wrong_pattern: |
          <!-- BEGIN GENERATED workspaces -->
          - packages/my-edit
          <!-- END GENERATED workspaces -->
        correct_pattern: |
          vp exec agentic-documents check --write
        source: "masseater/mst:packages/agentic-documents/src/run-cli.ts"
        priority: "MEDIUM"
        status: "active"

  - name: "write specification tests"
    slug: "verified-specifications-core"
    domain: "surfacing-verified-specifications"
    description: "Declare behavior claims in specs/<feature>.spec.ts and regenerate SPECIFICATIONS.md with verified-specifications check --write."
    type: "core"
    packages:
      - "@mst/verified-specifications"
    covers:
      - "verified-specifications check"
      - "--write"
      - "specs/<feature>.spec.ts"
      - "SPECIFICATIONS.md"
      - "claim naming rules"
    tasks:
      - "write a behavior claim"
      - "regenerate the specification list"
      - "decide spec test versus coverage test"
    failure_modes:
      - mistake: "SPECIFICATIONS.md edited by hand"
        mechanism: "the list is generated from the tests, so a hand edit is reported as stale and the next --write erases it."
        wrong_pattern: |
          - 手で追記した主張
        correct_pattern: |
          vp exec verified-specifications check --write
        source: "masseater/mst:packages/verified-specifications/AGENTS.md"
        priority: "HIGH"
        status: "active"
      - mistake: "claim written with a computed name"
        mechanism: "the extractor reads string literals, so a computed describe or it name cannot be read and the structure check reports it."
        wrong_pattern: |
          it(`${subject}は表を報告する`, () => {})
        correct_pattern: |
          it("規範が表の行として書かれていれば報告する", () => {})
        source: "masseater/mst:packages/verified-specifications/src/run-cli.ts"
        priority: "MEDIUM"
        status: "active"
      - mistake: "coverage exercise placed in specs/"
        mechanism: "an execution that is not a claim dilutes the generated list a human reads."
        wrong_pattern: |
          specs/read-json-file.spec.ts
        correct_pattern: |
          src/read-json-file.test.ts
        source: "masseater/mst:packages/verified-specifications/AGENTS.md"
        priority: "MEDIUM"
        status: "active"
      - mistake: "spec workspace tsconfig narrowed by include"
        mechanism: "narrowing include drops specs/ from type checking silently, so the check stays green while the claims rot."
        wrong_pattern: |
          { "include": ["src"] }
        correct_pattern: |
          { "extends": "@mst/dont-review-it/tsconfig/library.json" }
        source: "masseater/mst:packages/verified-specifications/AGENTS.md"
        priority: "MEDIUM"
        status: "active"

  - name: "throttle, spool, and keep output unabridged"
    slug: "ai-native-core"
    domain: "controlling-agent-command-resources"
    description: "Wrap heavy commands with throttle and spool, compose the wrappers in the safe order, and wire unabridged as a Bash PreToolUse hook."
    type: "core"
    packages:
      - "@mst/ai-native"
    covers:
      - "throttle"
      - "--timeout"
      - "MST_THROTTLE_LIMIT"
      - "spool"
      - ".spool/ logs"
      - "CI passthrough"
      - "unabridged PreToolUse hook"
      - "throttle -- spool composition"
    tasks:
      - "wrap a heavy command without oversubscribing the host"
      - "capture complete output without filling context"
      - "wire the Bash hook that rejects head and tail"
      - "diagnose a queued or failed wrapper run"
    failure_modes:
      - mistake: "spool placed outside throttle"
        mechanism: "spool captures the queue announcements, so a waiting command looks identical to a hung command."
        wrong_pattern: |
          spool -- throttle -- vp run guard
        correct_pattern: |
          throttle -- spool -- vp run guard
        source: "masseater/mst:packages/ai-native/AGENTS.md"
        priority: "HIGH"
        status: "active"
      - mistake: "throttle nested inside a command it wraps"
        mechanism: "the inner command consumes a second slot and can wait forever behind its own outer holder."
        wrong_pattern: |
          throttle -- vp run command-that-invokes-throttle
        correct_pattern: |
          throttle -- vp run command-without-a-second-throttle
        source: "masseater/mst:packages/ai-native/AGENTS.md"
        priority: "HIGH"
        status: "active"
      - mistake: "interactive command wrapped with spool"
        mechanism: "the prompt goes to the log file while the terminal stays silent, leaving the child waiting for input."
        wrong_pattern: |
          spool -- vp login
        correct_pattern: |
          vp login
        source: "masseater/mst:packages/ai-native/AGENTS.md"
        priority: "HIGH"
        status: "active"
      - mistake: "throttle namespace placed on a network file system"
        mechanism: "the lock contract requires host-local file-system semantics that NFS and SMB do not provide."
        wrong_pattern: |
          MST_THROTTLE_DIRECTORY=/network/share throttle -- vp test
        correct_pattern: |
          MST_THROTTLE_DIRECTORY=/host/local/path throttle -- vp test
        source: "masseater/mst:packages/ai-native/AGENTS.md"
        priority: "HIGH"
        status: "active"
      - mistake: "active slot lock deleted or replaced"
        mechanism: "altering slot-*.lock while a holder runs breaks mutual exclusion for every later command."
        wrong_pattern: |
          rm -rf slot-1.lock
        correct_pattern: |
          throttle -- vp test
        source: "masseater/mst:packages/ai-native/AGENTS.md"
        priority: "HIGH"
        status: "active"
      - mistake: "failed command rerun with an output filter"
        mechanism: "rerunning pays the cost twice and can erase the nondeterministic failure recorded in the original spool log."
        wrong_pattern: |
          vp test | tail -20
        correct_pattern: |
          read the complete log path printed by spool
        source: "masseater/mst:packages/ai-native/AGENTS.md"
        priority: "MEDIUM"
        status: "active"
      - mistake: "unabridged assumed to inspect nested shell command strings"
        mechanism: "bash -c and xargs place the nested command in an argument position that the hook does not parse."
        wrong_pattern: |
          bash -c 'vp test | tail'
        correct_pattern: |
          spool -- vp test
        source: "masseater/mst:packages/ai-native/AGENTS.md"
        priority: "MEDIUM"
        status: "active"
      - mistake: "unabridged enabled where spool is unreachable"
        mechanism: "the hook denies slicing but cannot offer a runnable complete-output repair path."
        wrong_pattern: |
          unabridged without spool on PATH
        correct_pattern: |
          vp exec spool -- vp test
        source: "masseater/mst:packages/ai-native/AGENTS.md"
        priority: "HIGH"
        status: "active"

  - name: "keep a pull-request review loop running"
    slug: "auto-develop-core"
    domain: "operating-pull-request-review-loops"
    description: "Run the GitHub webhook relay and the reviewer and author runtimes while preserving per-PR lane exclusivity and current-input commit statuses."
    type: "core"
    packages:
      - "@mst/auto-develop"
    covers:
      - "auto-develop reviewer"
      - "auto-develop author"
      - "auto-develop-relay"
      - "webhook, session, SSE, and startup-drain endpoints"
      - "per-PR lanes and concurrency"
      - "tmux worktree engine"
      - "--dry-run"
      - "current-input commit status"
    tasks:
      - "start the relay"
      - "start a reviewer or author runtime"
      - "wire credentials and startup drain"
      - "diagnose event-to-PR routing"
    failure_modes:
      - mistake: "linked worktree mounted without its external git common directory"
        mechanism: "the worktree's .git file points outside the mount, so Git commands inside the image cannot resolve the repository."
        wrong_pattern: |
          mount a linked worktree at /repository
        correct_pattern: |
          mount a self-contained checkout at /repository
        source: "masseater/mst:packages/auto-develop/skills/core/SKILL.md"
        priority: "HIGH"
        status: "active"
      - mistake: "GitHub token sent anywhere except the relay session endpoint"
        mechanism: "the runtime credential boundary permits the long-lived token only when exchanging it for a relay session."
        wrong_pattern: |
          send GH_TOKEN with an event subscription
        correct_pattern: |
          send GH_TOKEN only to POST /auth/session
        source: "masseater/mst:packages/auto-develop/skills/core/SKILL.md"
        priority: "CRITICAL"
        status: "active"
      - mistake: "pull-request diff or guidelines embedded in process arguments"
        mechanism: "large review input can exceed the operating system's argument-length limit at process spawn."
        wrong_pattern: |
          auto-develop reviewer --prompt '<complete diff>'
        correct_pattern: |
          pass the PR number and the run-context file path
        source: "masseater/mst:packages/auto-develop/skills/core/SKILL.md"
        priority: "HIGH"
        status: "active"
      - mistake: "GitHub login written to logs"
        mechanism: "identity resolution must be auditable without exposing the account name."
        wrong_pattern: |
          log the GitHub login
        correct_pattern: |
          log how identity and credentials were resolved
        source: "masseater/mst:packages/auto-develop/skills/core/SKILL.md"
        priority: "HIGH"
        status: "active"
      - mistake: "commit status written after the reviewed input changed"
        mechanism: "a verdict against an old base target or head SHA would be attached to code it did not review."
        wrong_pattern: |
          write the status without re-reading base and head
        correct_pattern: |
          recheck the input and enqueue one follow-up when it changed
        source: "masseater/mst:packages/auto-develop/skills/core/SKILL.md"
        priority: "HIGH"
        status: "active"
      - mistake: "queue snapshot read back on restart"
        mechanism: "disk restore duplicates the GitHub startup-drain recovery path and can schedule the same work twice."
        wrong_pattern: |
          restore queued jobs from the snapshot
        correct_pattern: |
          start empty and recover through the GitHub startup drain
        source: "masseater/mst:packages/auto-develop/skills/core/SKILL.md"
        priority: "HIGH"
        status: "active"
      - mistake: "duplicate event queued behind an active PR lane"
        mechanism: "the engine reads current state when it starts, so a queued duplicate only repeats work."
        wrong_pattern: |
          append every event to the active lane
        correct_pattern: |
          drop duplicates and replace only the single review-input follow-up
        source: "masseater/mst:packages/auto-develop/skills/core/SKILL.md"
        priority: "MEDIUM"
        status: "active"

  - name: "stop checks that only restate a removal"
    slug: "stop-ai-slop-core"
    domain: "rejecting-removal-only-verification"
    description: "Compare the change on its way into the integration branch and report absence assertions added by the same change that removed their subject."
    type: "core"
    packages:
      - "@mst/stop-ai-slop"
    covers:
      - "stop-ai-slop check"
      - "automatic integration comparison"
      - "--base and --head"
      - "--repository-root"
      - "ordered check registry"
      - "removal-verification locator matching"
    tasks:
      - "run the change-aware gate"
      - "remove an absence assertion that only pins the same change's deletion"
      - "add a check to the single registry"
      - "choose or let the CLI resolve the comparison range"
    failure_modes:
      - mistake: "absence assertion added with the deletion"
        mechanism: "the assertion only prevents re-adding the subject removed by the same change and fossilizes the removal."
        wrong_pattern: |
          expect(legacy).not.toHaveProperty("legacyMode")
        correct_pattern: |
          delete the absence assertion
        source: "masseater/mst:packages/stop-ai-slop/AGENTS.md"
        priority: "HIGH"
        status: "active"
      - mistake: "report suppressed by reshaping the assertion"
        mechanism: "making the locator unreadable removes the report without removing the removal-only verification."
        wrong_pattern: |
          expect(legacy).not.toHaveProperty(String("legacyMode"))
        correct_pattern: |
          delete the absence assertion
        source: "masseater/mst:packages/stop-ai-slop/AGENTS.md"
        priority: "MEDIUM"
        status: "active"
      - mistake: "comparison range guessed as HEAD~1 to HEAD"
        mechanism: "a multi-commit branch is reduced to its last commit instead of the change since the integration merge base."
        wrong_pattern: |
          vp exec stop-ai-slop check --base HEAD~1 --head HEAD
        correct_pattern: |
          vp exec stop-ai-slop check
        source: "masseater/mst:packages/stop-ai-slop/src/comparison-range.ts"
        priority: "MEDIUM"
        status: "active"

tensions:
  - name: "enforcement breadth versus unique fixes"
    skills: ["dont-review-it-core", "lint-rule-authoring-core"]
    description: "The preset only admits rules whose fix is unique, while rule authoring makes adding new prohibitions cheap."
    implication: 'An agent asked to "prevent X" writes a rule for a judgment call, and the report sends reviewers back to the debate the rule was meant to close.'
  - name: "message brevity versus explanation"
    skills: ["lint-rule-authoring-core", "agentic-documents-core"]
    description: "Report messages carry only the prohibition and the fix, while the docs side must carry the full reasoning."
    implication: "An agent folds the reason into the message and the fix instruction drowns; or it writes the docs file as a copy of the message and the reasoning exists nowhere."
  - name: "single gate versus per-tool entries"
    skills: ["dont-review-it-repository-checks", "agentic-documents-core"]
    description: "Every check must reach the one guard entry, while each tool ships its own runnable CLI."
    implication: "An agent wires a new check as a second workflow or subcommand, and the gate splits into entries that can be individually forgotten."

cross_references:
  - from: "dont-review-it-core"
    to: "lint-rule-authoring-core"
    reason: "The preset registers rules built by the factory; adding a rule touches both packages."
  - from: "dont-review-it-repository-checks"
    to: "dont-review-it-core"
    reason: "The check CLI covers what the lint preset cannot express; adopting one without the other leaves half the invariants unenforced."
  - from: "agentic-documents-core"
    to: "dont-review-it-repository-checks"
    reason: "Both are guard-run check CLIs with the same single-entry, nonzero-exit discipline."
  - from: "verified-specifications-core"
    to: "dont-review-it-repository-checks"
    reason: "Both CLIs run from guard with the same single-entry, nonzero-exit discipline."
  - from: "stop-ai-slop-core"
    to: "dont-review-it-repository-checks"
    reason: "Both CLIs run from guard with the same single-entry, nonzero-exit discipline."

