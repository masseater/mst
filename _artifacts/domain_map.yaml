library:
  name: "mst"
  version: "0.0.0"
  repository: "https://github.com/masseater/mst"
  description: "Reusable units of repository operation: a lint preset, repository checks, lint-rule authoring materials, document checks, and shared CLI plumbing."
  primary_framework: "framework-agnostic"

domains:
  - name: "enforcing writing standards"
    slug: "enforcing-writing-standards"
    description: "Wiring machine-enforced answers to review questions into a repository, and responding to their reports."
  - name: "gating the repository"
    slug: "gating-the-repository"
    description: "Running the repository-wide checks that lint rules cannot express, and keeping every gate a single failing entry."
  - name: "authoring lint rules"
    slug: "authoring-lint-rules"
    description: "Writing custom oxlint rules whose enforcement keeps working after they are written."
  - name: "keeping documents true"
    slug: "keeping-documents-true"
    description: "Writing AI-facing documents that match the repository and keep a machine-followable shape."
  - name: "surfacing verified specifications"
    slug: "surfacing-verified-specifications"
    description: "Declaring behavior claims as specification tests and generating the human-readable list from them."
  - name: "wrapping heavy commands"
    slug: "wrapping-heavy-commands"
    description: "Keeping parallel heavy commands inside the host's capacity and their output outside the caller's context window."
  - name: "answering pull requests without a human"
    slug: "answering-pull-requests"
    description: "Running the relay and the two runtimes that review a pull request and respond to its feedback unattended."
  - name: "stopping valueless additions"
    slug: "stopping-valueless-additions"
    description: "Reporting the code an AI adds to a change that only restates what the same change removed."

skills:
  - name: "adopt the dont-review-it preset"
    slug: "dont-review-it-core"
    domain: "enforcing-writing-standards"
    description: "Wire the oxlint preset, the js plugin, and the shared tsconfig presets into a Vite+ repository, and verify the wiring with a violating file."
    type: "core"
    packages:
      - "@mst/dont-review-it"
    covers:
      - "oxlint (preset export)"
      - "withGitExcludes"
      - "@mst/dont-review-it/plugin"
      - "@mst/dont-review-it/tsconfig/library.json"
      - "@mst/dont-review-it/tsconfig/app.json"
      - "vite.config.ts lint/fmt blocks"
    tasks:
      - "adopt the preset in a repository"
      - "verify a custom rule is actually wired"
      - "create a tsconfig that the preset accepts"
    failure_modes:
      - mistake: "ignorePatterns placed in an extended preset"
        mechanism: "oxlint's Oxlintrc::merge keeps only the extending side's ignore_patterns, so patterns shipped through extends silently vanish."
        wrong_pattern: |
          export const myPreset = defineConfig({
            extends: [somePreset],
            ignorePatterns: [".agents/"],
          });
        correct_pattern: |
          export default defineConfig({
            lint: dontReviewItPreset.lint({ ignorePatterns: [".agents/"] }),
          });
        source: "masseater/mst:.claude/rules/ai-generated/gotchas.md"
        priority: "HIGH"
        status: "active"
        version_context: "oxc behavior as of oxlint shipped with vite-plus 0.2.x"
      - mistake: "lint.plugins written as an addition"
        mechanism: "plugins replaces the base set, so naming one plugin disables the default unicorn/typescript/oxc rules while lint stays green."
        wrong_pattern: |
          lint: { plugins: ["vitest"] }
        correct_pattern: |
          lint: { plugins: ["unicorn", "typescript", "oxc", "vitest"] }
        source: "masseater/mst:.claude/rules/ai-generated/gotchas.md"
        priority: "HIGH"
        status: "active"
        skills: ["dont-review-it-core", "lint-rule-authoring-core"]
      - mistake: "print-config diff read as proof of js plugin wiring"
        mechanism: "vp lint --print-config resolves built-in rules only, so a js plugin rule appears in no diff and the check passes vacuously."
        wrong_pattern: |
          vp lint --print-config > after.json
          diff before.json after.json
        correct_pattern: |
          echo "export default {}" > packages/x/src/probe.ts
          vp lint packages/x/src/probe.ts
          rm packages/x/src/probe.ts
        source: "masseater/mst:.claude/rules/ai-generated/gotchas.md"
        priority: "HIGH"
        status: "active"
        skills: ["dont-review-it-core", "lint-rule-authoring-core"]
      - mistake: "standalone tsconfig written from scratch"
        mechanism: "a tsconfig without extends drifts from the shared compiler options, and no-standalone-tsconfig reports it."
        wrong_pattern: |
          { "compilerOptions": { "strict": true } }
        correct_pattern: |
          {
            "extends": "@mst/dont-review-it/tsconfig/library.json",
            "include": ["src"]
          }
        source: "masseater/mst:packages/dont-review-it/docs/lint/no-standalone-tsconfig--extend-shared-preset.md"
        priority: "MEDIUM"
        status: "active"
      - mistake: "a GitHub alert written with its body on the next line"
        mechanism: "fmt sets proseWrap: never, so a blockquote whose marker and body form one paragraph is joined into a single line and GitHub renders the marker as literal text."
        wrong_pattern: |
          > [!IMPORTANT] Install through the official installer.
        correct_pattern: |
          > [!IMPORTANT]
          >
          > Install through the official installer.
        source: "masseater/mst:docs/engineering-decision-logs/0046-let-the-formatter-own-where-markdown-lines-break.md"
        priority: "HIGH"
        status: "active"
      - mistake: "a second exported config added beside the preset"
        mechanism: "one rule set applied at the root reaches the whole repository; a second entry point makes the reach depend on which one a repository wired, returning the adoption decision to the caller."
        wrong_pattern: |
          export const dontReviewItStrictPreset = { lint: () => ({}) };
        correct_pattern: |
          export const dontReviewItPreset = { fmt, lint };
        source: "masseater/mst:packages/dont-review-it/AGENTS.md"
        priority: "MEDIUM"
        status: "active"
    compositions:
      - library: "vite-plus"
        skill: "none — the preset assumes the Vite+ toolchain and its vite.config.ts consolidation"

  - name: "run the repository checks"
    slug: "dont-review-it-repository-checks"
    domain: "gating-the-repository"
    description: "Run dont-review-it check as the single entry for the checks lint cannot express: canonical values, duplicated bodies, workflow definitions, and shipped agent skills."
    type: "core"
    packages:
      - "@mst/dont-review-it"
    covers:
      - "dont-review-it check"
      - "--repository-root"
      - "workflow definition checks"
      - "shipped intent skills check"
      - "guard wiring"
    tasks:
      - "wire the check into a repository gate"
      - "fix a reported workflow definition"
      - "make a published package ship its agent skills"
    failure_modes:
      - mistake: "check failure masked to keep a pipeline green"
        mechanism: "an appended || true turns a failing gate into a passing one, and the masked-failure check names exactly this rewrite."
        wrong_pattern: |
          run: pnpm exec dont-review-it check || true
        correct_pattern: |
          run: pnpm run guard
        source: "masseater/mst:packages/dont-review-it/src/workflows/checks/masked-failure.ts"
        priority: "CRITICAL"
        status: "active"
      - mistake: "gate workflow narrowed by its own trigger"
        mechanism: "a required job that filters its trigger by paths or branches never runs on the excluded changes, so the requirement is satisfied by absence."
        wrong_pattern: |
          on:
            push:
              paths: ["src/**"]
        correct_pattern: |
          on:
            push:
        source: "masseater/mst:packages/dont-review-it/src/workflows/checks/gating-trigger-filter.ts"
        priority: "HIGH"
        status: "active"
      - mistake: "run block holding a command sequence"
        mechanism: "logic placed in the workflow file cannot be executed locally, so the single-command-run check requires one command call that a script owns."
        wrong_pattern: |
          run: |
            pnpm install
            pnpm test
        correct_pattern: |
          run: pnpm run guard
        source: "masseater/mst:packages/dont-review-it/src/workflows/checks/single-command-run.ts"
        priority: "MEDIUM"
        status: "active"
      - mistake: "job running on undeclared default permissions"
        mechanism: "a job without a permissions block inherits the runner default, so the granted scopes are invisible in review."
        wrong_pattern: |
          jobs:
            guard:
              runs-on: ubuntu-latest
        correct_pattern: |
          jobs:
            guard:
              runs-on: ubuntu-latest
              permissions: {}
        source: "masseater/mst:packages/dont-review-it/src/workflows/checks/declared-permissions.ts"
        priority: "HIGH"
        status: "active"
      - mistake: "published package shipped without its agent skills"
        mechanism: "a package without skills/**/SKILL.md, without skills in files, or without the tanstack-intent keyword publishes fine, but agents that install it discover nothing."
        wrong_pattern: |
          { "name": "@scope/pkg", "files": ["dist"] }
        correct_pattern: |
          {
            "name": "@scope/pkg",
            "files": ["dist", "skills"],
            "keywords": ["tanstack-intent"]
          }
        source: "masseater/mst:packages/dont-review-it/src/intent-skills/shipped-skills.ts"
        priority: "HIGH"
        status: "active"
      - mistake: "a published entry point left pointing at TypeScript source"
        mechanism: "a workspace link resolves to the real path so Node strips types happily, while the published copy lands under node_modules where Node refuses with ERR_UNSUPPORTED_NODE_MODULES_TYPE_STRIPPING."
        wrong_pattern: |
          { "bin": { "my-cli": "./src/cli.ts" }, "files": ["dist"] }
        correct_pattern: |
          {
            "bin": { "my-cli": "./src/cli.ts" },
            "files": ["dist"],
            "publishConfig": { "bin": { "my-cli": "./dist/cli.mjs" } }
          }
        source: "masseater/mst:packages/dont-review-it/AGENTS.md"
        priority: "HIGH"
        status: "active"
      - mistake: "internal package left carrying skill wiring"
        mechanism: "a private package with a skills directory, a skills files entry, or the discovery keyword advertises a distribution surface that never ships."
        wrong_pattern: |
          { "name": "@scope/internal", "private": true, "keywords": ["tanstack-intent"] }
        correct_pattern: |
          { "name": "@scope/internal", "private": true }
        source: "masseater/mst:packages/dont-review-it/src/intent-skills/shipped-skills.ts"
        priority: "MEDIUM"
        status: "active"

  - name: "author a lint rule"
    slug: "lint-rule-authoring-core"
    domain: "authoring-lint-rules"
    description: "Write a custom oxlint rule through the factory, with its test beside it and its prose in a docs file, so the enforcement keeps working after it is written."
    type: "core"
    packages:
      - "@mst/lint-rule-authoring"
    covers:
      - "createWorkspaceLintRule"
      - "testLintRule"
      - "LINT_SEVERITY"
      - "@mst/lint-rule-authoring/plugin"
      - "report message discipline"
    tasks:
      - "add a new custom rule"
      - "write the rule's report message"
      - "test the rule"
    failure_modes:
      - mistake: "ParenthesizedExpression branch written in a rule"
        mechanism: "oxlint strips parentheses before handing the AST to js plugins, so the branch is unreachable and coverage never enters it."
        wrong_pattern: |
          if (node.type === "ParenthesizedExpression") {
            return unwrap(node.expression);
          }
        correct_pattern: |
          if (node.type === "ObjectExpression") {
            return node;
          }
        source: "masseater/mst:.claude/rules/ai-generated/gotchas.md"
        priority: "HIGH"
        status: "active"
      - mistake: "report message carrying a reason or a branch"
        mechanism: "reasons push the fix instruction out of the first line and case analysis returns the decision to the reader; the docs file owns both."
        wrong_pattern: |
          "Avoid default exports because they hurt refactoring; use named exports, or keep the default if a framework requires it."
        correct_pattern: |
          "A default export is forbidden. Export the declaration by name."
        source: "masseater/mst:packages/lint-rule-authoring/AGENTS.md"
        priority: "HIGH"
        status: "active"
      - mistake: "new rule confirmed by print-config diff"
        mechanism: "vp lint --print-config never lists js plugin rules, so an empty diff is read as wired when nothing was checked."
        wrong_pattern: |
          vp lint --print-config | grep my-rule
        correct_pattern: |
          echo "const violating = 1" > src/probe.ts
          vp lint src/probe.ts
          rm src/probe.ts
        source: "masseater/mst:.claude/rules/ai-generated/gotchas.md"
        priority: "HIGH"
        status: "active"
        skills: ["lint-rule-authoring-core", "dont-review-it-core"]
      - mistake: "a schema handed over from another module"
        mechanism: "the index extracts facts by parsing the rule's own file, so a schema referenced by identifier cannot be counted and the rule is published as one that takes no options while it goes on reading them."
        wrong_pattern: |
          import { CATALOG_ENTRY_SCHEMA } from "./catalog-entry-schema.ts";
          schema: CATALOG_ENTRY_SCHEMA,
        correct_pattern: |
          schema: [{ type: "object", properties: { intentionalRanges: { type: "array" } } }],
        source: "masseater/mst:.claude/rules/ai-generated/gotchas.md"
        priority: "MEDIUM"
        status: "active"
      - mistake: "rule added at warn severity"
        mechanism: "warn is the severity a human assigns after judgment; a rule introduced at warn is ignorable from day one and enforces nothing."
        wrong_pattern: |
          rules: { "my-plugin/my-rule": "warn" }
        correct_pattern: |
          rules: { "my-plugin/my-rule": LINT_SEVERITY.ERROR }
        source: "masseater/mst:CLAUDE.md"
        priority: "MEDIUM"
        status: "active"
      - mistake: "rule test isolated in a test directory"
        mechanism: "a test placed under tests/ detaches from its rule and the placement rules report it; the pair belongs side by side with named valid and invalid snippets."
        wrong_pattern: |
          tests/my-rule.spec.ts
        correct_pattern: |
          src/lint/oxlint/rules/my-rule.ts
          src/lint/oxlint/rules/my-rule.test.ts
        source: "masseater/mst:packages/lint-rule-authoring/AGENTS.md"
        priority: "MEDIUM"
        status: "active"

  - name: "write and check agent-facing documents"
    slug: "agentic-documents-core"
    domain: "keeping-documents-true"
    description: "Write normative documents in the condition-action notation and run agentic-documents check to keep them true to the repository."
    type: "core"
    packages:
      - "@mst/agentic-documents"
    covers:
      - "agentic-documents check"
      - "--write"
      - "normative notation (IF/THEN, decision keywords)"
      - "generated regions"
      - "frontmatter description"
    tasks:
      - "write a normative rule an agent can follow"
      - "fix a reported document"
      - "refresh generated regions"
    failure_modes:
      - mistake: "norms written as table rows"
        mechanism: "a rule inside a table cell has no condition-action shape, so readers guess which norm applies; the no-table check reports it."
        wrong_pattern: |
          | Rule | Meaning |
          | ---- | ------- |
          | no-x | avoid x |
        correct_pattern: |
          - IF: x is about to be written; THEN PROHIBIT: write x
        source: "masseater/mst:packages/agentic-documents/src/checks/no-table.ts"
        priority: "HIGH"
        status: "active"
      - mistake: "a reference that resolves to nothing"
        mechanism: "links in a normative document are followed by agents, and a missing target or heading anchor produces no error at read time — the agent proceeds without the rule the pointer stood in for."
        wrong_pattern: |
          See [the enforcement guide](../../docs/guidelines/enforcment.md#detection).
        correct_pattern: |
          See [the enforcement guide](../../docs/guidelines/enforcement.md#detection).
        source: "masseater/mst:packages/agentic-documents/src/checks/reference-targets.ts"
        priority: "HIGH"
        status: "active"
      - mistake: "a version number written into the prose"
        mechanism: "a version in prose has no mechanism keeping it current, so it stays right until the manifest moves and then instructs every reader to install the wrong one."
        wrong_pattern: |
          - IF: pinning the runtime; THEN MUST: use Node 26.7.0
        correct_pattern: |
          - IF: pinning the runtime; THEN MUST: use the version `devEngines.runtime` declares
        source: "masseater/mst:packages/agentic-documents/src/checks/version-in-prose.ts"
        priority: "MEDIUM"
        status: "active"
      - mistake: "two decision keywords on one line"
        mechanism: "a line holding MUST and PROHIBIT together leaves the binding keyword ambiguous, and the single-decision-keyword check reports it."
        wrong_pattern: |
          - IF: adding a rule; THEN MUST: add it as error and PROHIBIT: demote it
        correct_pattern: |
          - IF: adding a rule; THEN
            - MUST: add it as error
            - PROHIBIT: demote it
        source: "masseater/mst:packages/agentic-documents/src/checks/single-decision-keyword.ts"
        priority: "MEDIUM"
        status: "active"
      - mistake: "good and bad examples placed as a pair"
        mechanism: "a contrastive pair invites imitating the labels instead of the norm; the contrastive-code-pair check reports the pair in one section."
        wrong_pattern: |
          悪い例: `const x = 1`
          良い例: `const one = 1`
        correct_pattern: |
          `const one = 1`
        source: "masseater/mst:packages/agentic-documents/src/checks/contrastive-code-pair.ts"
        priority: "MEDIUM"
        status: "active"
      - mistake: "generated region edited by hand"
        mechanism: "hand edits inside a generated region are reported as stale on the next check; the generator owns the region."
        wrong_pattern: |
          <!-- BEGIN GENERATED workspaces -->
          - packages/my-edit
          <!-- END GENERATED workspaces -->
        correct_pattern: |
          pnpm exec agentic-documents check --write
        source: "masseater/mst:packages/agentic-documents/src/run-cli.ts"
        priority: "MEDIUM"
        status: "active"

  - name: "write specification tests"
    slug: "verified-specifications-core"
    domain: "surfacing-verified-specifications"
    description: "Declare behavior claims in specs/<feature>.spec.ts and regenerate SPECIFICATIONS.md with verified-specifications check --write."
    type: "core"
    packages:
      - "@mst/verified-specifications"
    covers:
      - "verified-specifications check"
      - "--write"
      - "specs/<feature>.spec.ts"
      - "SPECIFICATIONS.md"
      - "claim naming rules"
    tasks:
      - "write a behavior claim"
      - "regenerate the specification list"
      - "decide spec test versus coverage test"
    failure_modes:
      - mistake: "SPECIFICATIONS.md edited by hand"
        mechanism: "the list is generated from the tests, so a hand edit is reported as stale and the next --write erases it."
        wrong_pattern: |
          - 手で追記した主張
        correct_pattern: |
          pnpm exec verified-specifications check --write
        source: "masseater/mst:packages/verified-specifications/AGENTS.md"
        priority: "HIGH"
        status: "active"
      - mistake: "claim written with a computed name"
        mechanism: "the extractor reads string literals, so a computed describe or it name cannot be read and the structure check reports it."
        wrong_pattern: |
          it(`${subject}は表を報告する`, () => {})
        correct_pattern: |
          it("規範が表の行として書かれていれば報告する", () => {})
        source: "masseater/mst:packages/verified-specifications/src/run-cli.ts"
        priority: "MEDIUM"
        status: "active"
      - mistake: "a runner narrowed through a member"
        mechanism: "each, skip and only make the claim run in variants or not at all, and neither reads as one plain sentence about the subject; the check reports any describe or it reached through a member."
        wrong_pattern: |
          it.each(["表", "見出し"])("%s を報告する", () => {})
        correct_pattern: |
          it("規範が表の行として書かれていれば報告する", () => {})
        source: "masseater/mst:packages/verified-specifications/src/extract/claims.ts"
        priority: "MEDIUM"
        status: "active"
      - mistake: "a subject left with no claims under it"
        mechanism: "a describe with no it under it renders as a heading with nothing beneath, which reads as a subject whose claims were lost rather than one that was never written."
        wrong_pattern: |
          describe("規範文書の検査", () => {
            beforeEach(() => resetFixtures());
          });
        correct_pattern: |
          describe("規範文書の検査", () => {
            it("規範が表の行として書かれていれば報告する", () => {});
          });
        source: "masseater/mst:packages/verified-specifications/src/extract/claims.ts"
        priority: "MEDIUM"
        status: "active"
      - mistake: "coverage exercise placed in specs/"
        mechanism: "an execution that is not a claim dilutes the generated list a human reads."
        wrong_pattern: |
          specs/read-json-file.spec.ts
        correct_pattern: |
          src/read-json-file.test.ts
        source: "masseater/mst:packages/verified-specifications/AGENTS.md"
        priority: "MEDIUM"
        status: "active"
      - mistake: "spec workspace tsconfig narrowed by include"
        mechanism: "narrowing include drops specs/ from type checking silently, so the check stays green while the claims rot."
        wrong_pattern: |
          { "include": ["src"] }
        correct_pattern: |
          { "extends": "@mst/dont-review-it/tsconfig/library.json" }
        source: "masseater/mst:packages/verified-specifications/AGENTS.md"
        priority: "MEDIUM"
        status: "active"

  - name: "wrap a heavy command"
    slug: "ai-native-core"
    domain: "wrapping-heavy-commands"
    description: "Wrap an entry point with throttle and spool in that order, read the record a summary points at, wire the unabridged PreToolUse hook, and start telemetry once per process."
    type: "core"
    packages:
      - "@mst/ai-native"
    covers:
      - "throttle --timeout"
      - "MST_THROTTLE_LIMIT"
      - "spool"
      - ".spool/ log files"
      - "unabridged PreToolUse hook"
      - "@mst/ai-native/telemetry"
      - "@mst/ai-native/vitest-sdk"
      - "MST_TELEMETRY"
      - "OTEL_EXPORTER_OTLP_ENDPOINT"
    tasks:
      - "wrap a package.json entry point with both wrappers"
      - "read the full output behind a spool summary"
      - "wire the unabridged hook into an agent config"
      - "start the telemetry provider from a process entry point"
    failure_modes:
      - mistake: "wrappers composed with spool on the outside"
        mechanism: "throttle announces its queue position on stderr, so wrapping it inside spool diverts those announcements into the log file and a queued run looks identical to a hung one."
        wrong_pattern: |
          spool -- throttle -- vp run guard
        correct_pattern: |
          throttle -- spool -- vp run guard
        source: "masseater/mst:packages/ai-native/AGENTS.md"
        priority: "HIGH"
        status: "active"
      - mistake: "throttle nested inside the command it wraps"
        mechanism: "the inner call is an independent competitor for the same host and namespace, so it consumes a second slot and the limit stops bounding what it names."
        wrong_pattern: |
          throttle -- pnpm run guard   # where guard itself runs `throttle -- vp test`
        correct_pattern: |
          pnpm run guard               # where guard runs `throttle -- spool -- vp run guard:all`
        source: "masseater/mst:packages/ai-native/src/throttle/usage.ts"
        priority: "HIGH"
        status: "active"
      - mistake: "an interactive command wrapped with spool"
        mechanism: "the prompt is part of the child's output, so it is written to the log file while the terminal stays silent and the child waits for input that never arrives."
        wrong_pattern: |
          spool -- npm login
        correct_pattern: |
          npm login
        source: "masseater/mst:packages/ai-native/AGENTS.md"
        priority: "HIGH"
        status: "active"
      - mistake: "a wrapper failure read as the child's exit code"
        mechanism: "recording failures and slot failures make the run report failure even when the child succeeded, and throttle uses exit code 1 for both a failing child and a slot it could not acquire or release, so the number alone cannot tell the two apart."
        wrong_pattern: |
          spool -- vp run -r build
          echo "build failed with $?"
        correct_pattern: |
          spool -- vp run -r build
          # read the summary: the channel and wording say whether spool or the child failed
        source: "masseater/mst:packages/ai-native/src/spool/run-spool.ts"
        priority: "MEDIUM"
        status: "active"
      - mistake: "telemetry provider requested more than once per process"
        mechanism: "the first caller fixes service.name for the whole process, so a second entry point that asks for its own provider silently reports its spans under the first caller's service."
        wrong_pattern: |
          const provider = startTelemetry({ serviceName: "my-step" });
          const another = startTelemetry({ serviceName: "my-other-step" });
        correct_pattern: |
          const provider = startTelemetry({ serviceName: "my-command" });
        source: "masseater/mst:packages/ai-native/src/telemetry/telemetry.ts"
        priority: "MEDIUM"
        status: "active"
      - mistake: "unabridged expected to catch a sliced command inside a nested shell"
        mechanism: "the hook reads command positions of the command line it is handed, and `bash -c '... | tail'` collapses to one string token while `xargs head` puts head in an argument position, so both are allowed."
        wrong_pattern: |
          bash -c 'vp run -r test | tail -20'
        correct_pattern: |
          spool -- vp run -r test
        source: "masseater/mst:packages/ai-native/src/unabridged/find-slicing-commands.ts"
        priority: "MEDIUM"
        status: "active"

  - name: "keep a pull-request loop running"
    slug: "auto-develop-core"
    domain: "answering-pull-requests"
    description: "Run the relay and the reviewer and author runtimes, and keep one response per pull request while every verdict describes the input it was computed from."
    type: "core"
    packages:
      - "@mst/auto-develop"
    covers:
      - "relay server endpoints"
      - "reviewer runtime"
      - "author runtime"
      - "--concurrency"
      - "--dry-run"
      - "per-PR job lanes"
      - "startup drain"
      - "engine run context"
    tasks:
      - "start the relay and point a webhook at it"
      - "start a runtime against a repository"
      - "decide how a GitHub event reaches a pull request job"
    failure_modes:
      - mistake: "the GitHub token presented to a subscriber endpoint"
        mechanism: "the stream resolves its bearer against the session store, so a GitHub token there is an unknown credential and comes back 401 — after the token has already been sent to whatever origin the caller named, and the 401 reads as a wiring problem rather than a leak."
        wrong_pattern: |
          curl -H "authorization: Bearer $GH_TOKEN" "$RELAY_ORIGIN/events/stream?mode=reviewer"
        correct_pattern: |
          SESSION=$(curl -sX POST -H "authorization: Bearer $GH_TOKEN" "$RELAY_ORIGIN/auth/session" | jq -r .token)
          curl -H "authorization: Bearer $SESSION" "$RELAY_ORIGIN/events/stream?mode=reviewer"
        source: "masseater/mst:packages/auto-develop/specs/relay-credential.spec.ts"
        priority: "CRITICAL"
        status: "active"
      - mistake: "the pull request diff put into the engine prompt"
        mechanism: "the prompt is handed to the agent CLI as process arguments, so a diff large enough to exceed the argument length limit fails at spawn — the loop works on small pull requests and breaks on the ones worth reviewing."
        wrong_pattern: |
          Review this pull request. Here is the diff:
          <the whole unified diff>
        correct_pattern: |
          Review PR #123. The run context is at .repo-workflow/review-context/<run-id>/review-carried.json.
        source: "masseater/mst:packages/auto-develop/specs/engine-session.spec.ts"
        priority: "HIGH"
        status: "active"
      - mistake: "a wiring change tried against a live repository without --dry-run"
        mechanism: "every write to GitHub is real, so a run started to confirm the relay connection leaves commit statuses and review comments that nothing distinguishes from a verdict the loop meant to publish."
        wrong_pattern: |
          auto-develop reviewer --pr 123
        correct_pattern: |
          auto-develop reviewer --pr 123 --dry-run
        source: "masseater/mst:packages/auto-develop/src/cli/runtime-command.ts"
        priority: "HIGH"
        status: "active"
      - mistake: "the queue snapshot read back after a restart"
        mechanism: "the snapshot is written for humans and audits only, so reading it back adds a second recovery path that disagrees with the startup drain whenever GitHub moved while the process was down."
        wrong_pattern: |
          recovering the in-flight work by loading the snapshot the previous process wrote to disk
        correct_pattern: |
          starting from an empty in-memory queue and letting GET /events/startup-drain re-derive the work
        source: "masseater/mst:packages/auto-develop/specs/job-lane.spec.ts"
        priority: "HIGH"
        status: "active"
      - mistake: "a pull-request filter that parses to nothing"
        mechanism: "--pr keeps only the positive integers it can parse and drops the rest without a word, and an empty target list means every lane, so one unparseable entry turns a scoped run into a run over all pull requests."
        wrong_pattern: |
          auto-develop reviewer --pr "#123"
        correct_pattern: |
          auto-develop reviewer --pr 123
        source: "masseater/mst:packages/auto-develop/src/cli/runtime-command.ts"
        priority: "HIGH"
        status: "active"
      - mistake: "the same number given to both pull-request filters"
        mechanism: "exclusion is applied after selection, so a number named on both lists never runs while the command reports nothing about the contradiction."
        wrong_pattern: |
          auto-develop author --pr 41,42 --exclude-pr 42
        correct_pattern: |
          auto-develop author --pr 41
        source: "masseater/mst:packages/auto-develop/specs/job-lane.spec.ts"
        priority: "MEDIUM"
        status: "active"
      - mistake: "an environment address written as a constant"
        mechanism: "an endpoint, credential, or repository baked into the implementation cannot be changed by configuration, so the package runs against exactly one environment and fails silently in any other."
        wrong_pattern: |
          const repository = "masseater/mst";
        correct_pattern: |
          const repository = requireEnv("GITHUB_REPOSITORY");
        source: "masseater/mst:packages/auto-develop/AGENTS.md"
        priority: "MEDIUM"
        status: "active"

  - name: "stop the checks that only restate a removal"
    slug: "stop-ai-slop-core"
    domain: "stopping-valueless-additions"
    description: "Run stop-ai-slop check over the change on its way into the integration branch and delete the absence assertions it reports instead of reshaping them."
    type: "core"
    packages:
      - "@mst/stop-ai-slop"
    covers:
      - "stop-ai-slop check"
      - "--base / --head"
      - "--repository-root"
      - "comparison range resolution"
      - "src/check-registry.ts"
    tasks:
      - "run the check over a branch"
      - "respond to a removal-verification report"
      - "register a new check"
    failure_modes:
      - mistake: "an absence assertion added by the change that removed its subject"
        mechanism: "the assertion can only fail if someone re-adds the export the same change deleted, so it pins a state the deletion already records and every later reader has to work out why it is there."
        wrong_pattern: |
          import * as legacy from "./legacy.ts";
          expect(legacy).not.toHaveProperty("legacyMode");
        correct_pattern: |
          import { current } from "./legacy.ts";
          expect(current).toBe(true);
        source: "masseater/mst:packages/stop-ai-slop/AGENTS.md"
        priority: "HIGH"
        status: "active"
      - mistake: "the assertion reshaped until the locator cannot be recovered"
        mechanism: "the check reports a locator it can resolve statically, so hiding the name behind a computed expression removes the report while the assertion it names stays in the suite."
        wrong_pattern: |
          expect(legacy).not.toHaveProperty(String("legacyMode"));
        correct_pattern: |
          // the assertion is deleted
        source: "masseater/mst:packages/stop-ai-slop/AGENTS.md"
        priority: "MEDIUM"
        status: "active"
      - mistake: "revisions guessed instead of resolved"
        mechanism: "HEAD~1 is the previous commit rather than the point the change left the integration branch, so a branch with more than one commit is compared over its last step only and every earlier addition goes unreported."
        wrong_pattern: |
          stop-ai-slop check --base HEAD~1 --head HEAD
        correct_pattern: |
          stop-ai-slop check
        source: "masseater/mst:packages/stop-ai-slop/src/comparison-range.ts"
        priority: "MEDIUM"
        status: "active"
      - mistake: "a new check published as its own subcommand"
        mechanism: "check runs the registry in definition order, so a check reachable only through a second subcommand exists without running until every caller is updated to name it."
        wrong_pattern: |
          defineCommand({ subCommands: { check, "check-removals": checkRemovals } });
        correct_pattern: |
          export const CHECKS: readonly SlopCheck[] = [noRemovalVerification, checkRemovals];
        source: "masseater/mst:packages/stop-ai-slop/AGENTS.md"
        priority: "MEDIUM"
        status: "active"

tensions:
  - name: "enforcement breadth versus unique fixes"
    skills: ["dont-review-it-core", "lint-rule-authoring-core"]
    description: "The preset only admits rules whose fix is unique, while rule authoring makes adding new prohibitions cheap."
    implication: 'An agent asked to "prevent X" writes a rule for a judgment call, and the report sends reviewers back to the debate the rule was meant to close.'
  - name: "message brevity versus explanation"
    skills: ["lint-rule-authoring-core", "agentic-documents-core"]
    description: "Report messages carry only the prohibition and the fix, while the docs side must carry the full reasoning."
    implication: "An agent folds the reason into the message and the fix instruction drowns; or it writes the docs file as a copy of the message and the reasoning exists nowhere."
  - name: "single gate versus per-tool entries"
    skills: ["dont-review-it-repository-checks", "agentic-documents-core"]
    description: "Every check must reach the one guard entry, while each tool ships its own runnable CLI."
    implication: "An agent wires a new check as a second workflow or subcommand, and the gate splits into entries that can be individually forgotten."

cross_references:
  - from: "dont-review-it-core"
    to: "lint-rule-authoring-core"
    reason: "The preset registers rules built by the factory; adding a rule touches both packages."
  - from: "dont-review-it-repository-checks"
    to: "dont-review-it-core"
    reason: "The check CLI covers what the lint preset cannot express; adopting one without the other leaves half the invariants unenforced."
  - from: "agentic-documents-core"
    to: "dont-review-it-repository-checks"
    reason: "Both are guard-run check CLIs with the same single-entry, nonzero-exit discipline."
  - from: "stop-ai-slop-core"
    to: "dont-review-it-repository-checks"
    reason: "Both are guard-run check CLIs with the same single-entry, nonzero-exit discipline."
  - from: "ai-native-core"
    to: "dont-review-it-repository-checks"
    reason: "The gate the checks run inside is the command the wrappers wrap; the composition order is decided once, at that entry."
  - from: "ai-native-core"
    to: "lint-rule-authoring-core"
    reason: "Rule duration is exported through the telemetry entry this package owns, so a rule that measures itself starts here."

gaps:
  - skill: "dont-review-it-core"
    question: "Are external consumers (repositories other than mst) expected before 1.0, and should the skills assume a Vite+ toolchain or plain oxlint?"
    context: "Setup snippets currently assume vite.config.ts consolidation."
    status: "open"
  - skill: "dont-review-it-core"
    question: "Should the 29 lint rules get per-rule reference files, or does the docs/lint/ directory stay the single authority?"
    context: "Intent supports references/ for dense surfaces; docs/lint/ already holds one file per rule."
    status: "open"
  - skill: "dont-review-it-repository-checks"
